name: OpenDeck
options:
  bundleIdPrefix: com.opendeck
  deploymentTarget: '16.0'
targets:
  OpenDeck:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - OpenDeck
    info:
      path: OpenDeck/Info.plist
      properties:
        CFBundleDisplayName: OpenDeck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        NFCReaderUsageDescription: OpenDeck uses NFC to read and write tags.
        CFBundleURLTypes:
          - CFBundleURLName: com.opendeck.app
            CFBundleURLSchemes:
              - opendeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendeck.app
        CODE_SIGN_ENTITLEMENTS: OpenDeck/OpenDeck.entitlements
        SWIFT_VERSION: '5.10'
        TARGETED_DEVICE_FAMILY: '1,2'
  OpenDeckTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: OpenDeckTests
    dependencies:
      - target: OpenDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendeck.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/OpenDeck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenDeck'
        BUNDLE_LOADER: '$(TEST_HOST)'
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_VERSION: '5.10'
schemes:
  OpenDeck:
    build:
      targets:
        OpenDeck: all
        OpenDeckTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenDeckTests
    profile:
      config: Release
    analyze:
      config: Debug
