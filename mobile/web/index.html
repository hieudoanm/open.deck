<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenDeck Web</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0d0f12;
        color: #e6e8eb;
        font:
          14px/1.4 -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 14px;
        background: #161a20;
        border-bottom: 1px solid #262b33;
      }
      header input {
        background: #0d0f12;
        color: #e6e8eb;
        border: 1px solid #333a45;
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        width: 110px;
      }
      header input.token {
        width: 160px;
      }
      header button {
        background: #3b82f6;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 7px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      header button.secondary {
        background: #262b33;
      }
      #status {
        margin-left: auto;
        color: #8a919c;
        font-size: 12px;
      }
      #status.ok {
        color: #22c55e;
      }
      #status.err {
        color: #ef4444;
      }
      #stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 8px;
        background: #000;
      }
      #screen {
        max-width: 100%;
        max-height: 100%;
        background: #111;
        cursor: crosshair;
        touch-action: none;
        outline: none;
        image-rendering: auto;
      }
      #placeholder {
        color: #5c636e;
        text-align: center;
        padding: 24px;
      }
      #keybar {
        display: flex;
        gap: 6px;
        justify-content: center;
        flex-wrap: wrap;
        padding: 8px 10px;
        background: #161a20;
        border-top: 1px solid #262b33;
      }
      #keybar button {
        background: #262b33;
        color: #e6e8eb;
        border: 1px solid #333a45;
        border-radius: 6px;
        padding: 7px 14px;
        font: inherit;
        cursor: pointer;
        min-width: 44px;
      }
      #keybar button:active {
        background: #3b82f6;
      }
    </style>
  </head>
  <body>
    <header>
      <input
        id="host"
        value="127.0.0.1"
        placeholder="host"
        spellcheck="false"
      />
      <input
        id="port"
        value="47821"
        placeholder="port"
        inputmode="numeric"
        spellcheck="false"
      />
      <input
        id="token"
        class="token"
        placeholder="pairing token"
        spellcheck="false"
      />
      <button id="connectBtn">Connect</button>
      <span id="status">disconnected</span>
    </header>

    <div id="stage">
      <canvas id="screen" tabindex="0"></canvas>
      <div id="placeholder">
        Enter the pairing token printed by open-deck-server, then Connect.
      </div>
    </div>

    <div id="keybar">
      <button data-key="Escape">Esc</button>
      <button data-key="Tab">Tab</button>
      <button data-key="Return">Enter</button>
      <button data-key="Backspace">Bksp</button>
      <button data-key="Delete">Del</button>
      <button data-key="ArrowLeft">&#8592;</button>
      <button data-key="ArrowUp">&#8593;</button>
      <button data-key="ArrowDown">&#8595;</button>
      <button data-key="ArrowRight">&#8594;</button>
      <button data-key="Control+Alt+Delete">CAD</button>
    </div>

    <script>
      'use strict';

      const $ = (id) => document.getElementById(id);
      const canvas = $('screen');
      const ctx = canvas.getContext('2d');
      const placeholder = $('placeholder');
      const statusEl = $('status');
      const connectBtn = $('connectBtn');

      let ws = null;
      let hello = null; // {desktop_width, desktop_height, stream_width, stream_height}

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || '';
      }

      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify(obj));
      }

      function sendKey(key, state) {
        send({ type: 'key', key, state });
      }
      function sendPress(key) {
        send({ type: 'key', key, state: 'press' });
      }

      // ---------- WebSocket ----------

      connectBtn.addEventListener('click', () => {
        if (ws) {
          disconnect();
          return;
        }
        const host = $('host').value.trim() || '127.0.0.1';
        const port = $('port').value.trim() || '47821';
        const token = $('token').value.trim();
        const url = `ws://${host}:${port}/ws?token=${encodeURIComponent(token)}`;

        setStatus('connecting…');
        connectBtn.textContent = 'Disconnect';
        connectBtn.classList.add('secondary');

        ws = new WebSocket(url);
        ws.binaryType = 'blob';

        ws.onopen = () => {
          send({ type: 'hello', name: 'OpenDeck Web', version: 1 });
          canvas.focus();
        };

        ws.onmessage = async (ev) => {
          if (typeof ev.data === 'string') {
            let msg;
            try {
              msg = JSON.parse(ev.data);
            } catch {
              return;
            }
            if (msg.type === 'hello') {
              hello = msg;
              canvas.width = msg.stream_width;
              canvas.height = msg.stream_height;
              placeholder.style.display = 'none';
              setStatus(
                `${msg.desktop_width}x${msg.desktop_height} desktop · ${msg.stream_width}x${msg.stream_height} stream · ${msg.fps}fps`,
                'ok'
              );
            } else if (msg.type === 'error') {
              setStatus('error: ' + msg.message, 'err');
            } else if (msg.type === 'stats') {
              setStatus(
                `cpu ${msg.cpu_percent?.toFixed(0) ?? '?'}% · ${fmtBytes(msg.mem_used)}/${fmtBytes(msg.mem_total)} · ${msg.clients ?? ''} client(s)`,
                'ok'
              );
            }
            return;
          }
          // Binary frame: JPEG of the screen.
          try {
            const bmp = await createImageBitmap(ev.data);
            ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
            bmp.close();
          } catch {
            /* partial/garbage frame */
          }
        };

        ws.onclose = () => {
          setStatus('disconnected');
          connectBtn.textContent = 'Connect';
          connectBtn.classList.remove('secondary');
          ws = null;
        };
        ws.onerror = () => setStatus('connection failed', 'err');
      });

      function disconnect() {
        if (ws) ws.close();
      }

      function fmtBytes(n) {
        if (n == null) return '?';
        const u = ['B', 'KB', 'MB', 'GB', 'TB'];
        let i = 0,
          v = n;
        while (v >= 1024 && i < u.length - 1) {
          v /= 1024;
          i++;
        }
        return `${v.toFixed(i ? 1 : 0)}${u[i]}`;
      }

      // ---------- Mouse ----------

      const BUTTONS = ['left', 'middle', 'right', 'back', 'forward'];

      function toDesktop(e) {
        const r = canvas.getBoundingClientRect();
        if (!hello || r.width === 0) return null;
        const fx = (e.clientX - r.left) / r.width;
        const fy = (e.clientY - r.top) / r.height;
        return {
          x: Math.round(fx * hello.desktop_width),
          y: Math.round(fy * hello.desktop_height)
        };
      }

      canvas.addEventListener('pointermove', (e) => {
        const p = toDesktop(e);
        if (p) send({ type: 'mouse_move', x: p.x, y: p.y });
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        canvas.focus();
        const p = toDesktop(e);
        if (!p) return;
        send({ type: 'mouse_move', x: p.x, y: p.y });
        const b = BUTTONS[e.button];
        if (b) send({ type: 'mouse_button', button: b, state: 'down' });
      });

      window.addEventListener('pointerup', (e) => {
        const b = BUTTONS[e.button];
        if (b) send({ type: 'mouse_button', button: b, state: 'up' });
      });

      canvas.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const dy =
            Math.sign(e.deltaY) *
            Math.max(1, Math.round(Math.abs(e.deltaY) / 100));
          const dx =
            Math.sign(e.deltaX) *
            Math.max(1, Math.round(Math.abs(e.deltaX) / 100));
          if (dx || dy) send({ type: 'scroll', dx, dy });
        },
        { passive: false }
      );

      // ---------- Keyboard ----------

      const KEY_NAMES = {
        Enter: 'Return',
        Escape: 'Escape',
        Backspace: 'Backspace',
        Tab: 'Tab',
        Delete: 'Delete',
        Insert: 'Insert',
        Home: 'Home',
        End: 'End',
        PageUp: 'PageUp',
        PageDown: 'PageDown',
        ArrowUp: 'ArrowUp',
        ArrowDown: 'ArrowDown',
        ArrowLeft: 'ArrowLeft',
        ArrowRight: 'ArrowRight',
        Control: 'Control',
        Alt: 'Alt',
        Shift: 'Shift',
        Meta: 'Meta',
        CapsLock: 'CapsLock'
      };

      function namedKey(e) {
        if (KEY_NAMES[e.key] !== undefined) return KEY_NAMES[e.key];
        if (/^F([1-9]|1[0-2])$/.test(e.key)) return e.key;
        return null;
      }

      function chordFor(e) {
        const parts = [];
        if (e.ctrlKey) parts.push('Control');
        if (e.altKey) parts.push('Alt');
        if (e.shiftKey && e.key.length === 1) parts.push('Shift');
        if (e.metaKey) parts.push('Meta');
        if (parts.length === 0 || e.key.length !== 1) return null;
        return parts.join('+') + '+' + e.key.toUpperCase();
      }

      window.addEventListener('keydown', (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (e.key === 'F5' || e.key === 'F11' || e.key === 'F12') return; // keep devtools/reload usable

        const chord = chordFor(e);
        if (chord) {
          e.preventDefault();
          sendPress(chord);
          return;
        }

        const named = namedKey(e);
        if (named) {
          e.preventDefault();
          sendKey(named, 'down');
          return;
        }

        // Printable character -> OS text input path (handles shift/compose naturally).
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          send({ type: 'text', text: e.key });
        }
      });

      window.addEventListener('keyup', (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const named = namedKey(e);
        if (named) sendKey(named, 'up');
      });

      // ---------- On-screen key bar ----------

      document.querySelectorAll('#keybar button').forEach((btn) => {
        btn.addEventListener('click', () => sendPress(btn.dataset.key));
      });
    </script>
  </body>
</html>
