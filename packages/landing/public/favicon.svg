<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <!-- deck button grid: 3x3 -->
  <g fill="#ffffff">
    <rect x="88"  y="88"  width="100" height="100" rx="22" opacity="0.95"/>
    <rect x="206" y="88"  width="100" height="100" rx="22" opacity="0.7"/>
    <rect x="324" y="88"  width="100" height="100" rx="22" opacity="0.5"/>
    <rect x="88"  y="206" width="100" height="100" rx="22" opacity="0.7"/>
    <rect x="206" y="206" width="100" height="100" rx="22" opacity="1" fill="#fbbf24"/>
    <rect x="324" y="206" width="100" height="100" rx="22" opacity="0.7"/>
    <rect x="88"  y="324" width="100" height="100" rx="22" opacity="0.5"/>
    <rect x="206" y="324" width="100" height="100" rx="22" opacity="0.7"/>
    <rect x="324" y="324" width="100" height="100" rx="22" opacity="0.95"/>
  </g>
</svg>
