[package]
name = "open-deck-server"
version = "0.1.0"
edition = "2021"
description = "OpenDeck companion server: streams your desktop to your phone and injects input"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
futures-util = "=0.3.34"
xcap = "=0.9.10"
enigo = "=0.6.1"
image = "=0.25.10"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
clap = { version = "=4.6.10", features = ["derive", "env"] }
anyhow = "=1.0.105"
rand = "=0.10.4"
sysinfo = "=0.40.4"
qrcode = "=0.15.0"
include_dir = "=0.7.4"
