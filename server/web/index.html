<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>OpenDeck</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --card: #14181f;
        --card-2: #1c222b;
        --line: #2a313c;
        --text: #eef1f5;
        --muted: #8a93a3;
        --accent: #4f8cff;
        --ok: #34c77b;
        --err: #ff5d5d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        height: 100dvh; /* dynamic viewport — tracks Safari's collapsing toolbar */
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        overflow: hidden;
        touch-action: manipulation; /* kill double-tap zoom */
      }

      /* ---------- Connect ---------- */
      #connectView {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 24px;
      }
      .card h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .card .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 22px;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .field input {
        width: 100%;
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 11px 13px;
        font: inherit;
        outline: none;
      }
      .field input:focus {
        border-color: var(--accent);
      }
      .row2 {
        display: flex;
        gap: 10px;
      }
      .row2 .field {
        flex: 1;
      }
      #connectBtn {
        width: 100%;
        margin-top: 6px;
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 13px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      #connectBtn:active {
        filter: brightness(0.9);
      }
      #connectStatus {
        margin-top: 12px;
        font-size: 12.5px;
        color: var(--muted);
        text-align: center;
        min-height: 18px;
      }
      #connectStatus.ok {
        color: var(--ok);
      }
      #connectStatus.err {
        color: var(--err);
      }
      .hint {
        margin-top: 18px;
        font-size: 11.5px;
        color: var(--muted);
        text-align: center;
      }

      /* ---------- Widget pager ---------- */
      #deckView {
        display: none;
        height: 100%;
        flex-direction: column;
        padding: calc(14px + env(safe-area-inset-top))
          calc(14px + env(safe-area-inset-right))
          calc(14px + env(safe-area-inset-bottom))
          calc(14px + env(safe-area-inset-left));
        overflow: hidden;
      }
      body.in-session #connectView {
        display: none;
      }
      body.in-session #deckView {
        display: flex;
      }
      #pager {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
        touch-action: pan-y;
      }
      #track {
        display: flex;
        height: 100%;
        transition: transform 0.25s ease;
      }
      .page {
        flex: 0 0 100%;
        height: 100%;
        padding: 2px;
        display: flex;
        flex-direction: column;
        container-type: size;
      }
      .page > .widget {
        flex: 1;
        min-height: 0;
      }
      .page .grid {
        flex: 1;
        min-height: 0;
        grid-template-columns: repeat(
          auto-fill,
          minmax(clamp(120px, 24cqw, 200px), 1fr)
        );
        grid-auto-rows: minmax(0, 1fr);
        align-content: stretch;
      }
      .page .widget {
        min-height: 0;
      }
      .page-title {
        font-size: clamp(10px, 1.8cqh, 12px);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: clamp(4px, 1.2cqh, 10px);
      }
      #dots {
        position: absolute;
        bottom: calc(8px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
        z-index: 4;
        pointer-events: none;
      }
      #dots button {
        pointer-events: auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 0;
        background: rgba(255, 255, 255, 0.25);
        padding: 0;
        cursor: pointer;
      }
      #dots button.on {
        background: var(--accent);
      }
      #deckView {
        position: relative;
      }
      .navbtn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card-2);
        color: var(--text);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .navbtn:active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      #topBar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      #topBar .title {
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #topBar .spacer {
        flex: 1;
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
      }
      #statusText {
        color: var(--muted);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #wakeBadge {
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        flex: 0 0 auto;
      }
      body:not(.in-session) #wakeBadge {
        display: none;
      }
      #wakeBadge.on {
        color: var(--ok);
        border-color: rgba(62, 207, 142, 0.4);
      }
      #wakeBadge.off {
        color: var(--err);
        border-color: rgba(255, 93, 93, 0.4);
      }
      #topBar button {
        background: var(--card-2);
        color: var(--accent);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #disconnectBtn {
        color: var(--err);
        border-color: rgba(255, 93, 93, 0.4);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: clamp(6px, 1.2cqh, 12px);
      }
      .widget {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: clamp(8px, 1.8cqh, 14px) clamp(10px, 2.2cqw, 16px);
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: clamp(2px, 1cqh, 8px);
        overflow: hidden;
      }
      .widget.wide {
        grid-column: span 2;
      }
      .widget .label {
        font-size: clamp(9px, 1.7cqh, 11px);
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .widget .value {
        font-size: clamp(16px, 4.2cqh, 26px);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: clamp(0px, 0.6cqh, 6px);
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .widget .value small {
        font-size: clamp(10px, 2cqh, 13px);
        font-weight: 500;
        color: var(--muted);
      }
      .widget .sub {
        font-size: clamp(10px, 1.9cqh, 12px);
        color: var(--muted);
        margin-top: clamp(0px, 0.8cqh, 4px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar {
        height: clamp(3px, 0.8cqh, 6px);
        border-radius: 3px;
        background: var(--card-2);
        margin-top: clamp(2px, 1cqh, 8px);
        overflow: hidden;
        flex: 0 0 auto;
      }
      .bar > i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
        width: 0%;
        transition: width 0.4s ease;
      }
      .bar > i.hot {
        background: var(--err);
      }
      .bar > i.warm {
        background: #f5a524;
      }

      /* List widgets */
      .list {
        margin-top: clamp(2px, 0.8cqh, 8px);
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        font-size: clamp(10.5px, 2.1cqh, 13px);
      }
      .list .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        padding: 2px 0;
      }
      .list .row b {
        color: var(--text);
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list .row .num {
        font-variant-numeric: tabular-nums;
        flex: 0 0 auto;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }

      /* Clock widget */
      #clockWidget .value {
        font-size: clamp(24px, 6.5cqh, 40px);
        font-variant-numeric: tabular-nums;
      }
      @media (min-width: 720px) {
        .widget.wide {
          grid-column: span 2;
        }
      }
    </style>
  </head>
  <body>
    <!-- Connect -->
    <div id="connectView">
      <div class="card">
        <h1>OpenDeck</h1>
        <div class="sub">Your desktop, at a glance.</div>
        <div class="row2">
          <div class="field">
            <label>Host</label>
            <input
              id="host"
              value="127.0.0.1"
              placeholder="192.168.1.10"
              spellcheck="false"
            />
          </div>
          <div class="field">
            <label>Port</label>
            <input
              id="port"
              value="47821"
              inputmode="numeric"
              spellcheck="false"
            />
          </div>
        </div>
        <div class="field">
          <label>Pairing token</label>
          <input
            id="token"
            placeholder="printed by open-deck-server"
            spellcheck="false"
          />
        </div>
        <button id="connectBtn">Connect</button>
        <div id="connectStatus"></div>
        <div class="hint">Same Wi-Fi as your computer · free &amp; local</div>
      </div>
    </div>

    <!-- Widgets -->
    <div id="deckView">
      <div id="topBar">
        <button class="navbtn" id="prevBtn" aria-label="previous">‹</button>
        <span class="title">OpenDeck</span>
        <span id="dot"></span>
        <span id="statusText">connecting…</span>
        <span id="wakeBadge" title="screen wake lock">wake</span>
        <span style="flex: 1"></span>
        <button id="refreshBtn">Refresh</button>
        <button id="disconnectBtn">Disconnect</button>
        <button class="navbtn" id="nextBtn" aria-label="next">›</button>
      </div>

      <div id="pager">
        <div id="track">
          <!-- Page 1: host stats -->
          <section class="page">
            <div class="page-title">System</div>
            <div class="grid">
              <div class="widget" id="clockWidget">
                <div class="label">Time</div>
                <div class="value" id="clockTime">--:--</div>
                <div class="sub" id="clockDate"></div>
              </div>

              <div class="widget">
                <div class="label">CPU</div>
                <div class="value">
                  <span id="cpuVal">–</span><small>%</small>
                </div>
                <div class="bar"><i id="cpuBar"></i></div>
              </div>

              <div class="widget">
                <div class="label">Memory</div>
                <div class="value">
                  <span id="memVal">–</span><small id="memTotal"></small>
                </div>
                <div class="sub" id="memSub"></div>
                <div class="bar"><i id="memBar"></i></div>
              </div>

              <div class="widget">
                <div class="label">Disk</div>
                <div class="value">
                  <span id="diskVal">–</span><small id="diskTotal"></small>
                </div>
                <div class="bar"><i id="diskBar"></i></div>
              </div>

              <div class="widget">
                <div class="label">Network</div>
                <div class="value"><span id="netDown">–</span></div>
                <div class="sub">
                  ↓ <span id="netRx">–</span> · ↑ <span id="netTx">–</span>
                </div>
              </div>

              <div class="widget">
                <div class="label">Uptime</div>
                <div class="value" id="uptimeVal">–</div>
                <div class="sub" id="uptimeSub"></div>
              </div>

              <div class="widget">
                <div class="label">Display</div>
                <div class="value" id="dispVal">–</div>
                <div class="sub" id="dispSub"></div>
              </div>

              <div class="widget" id="batteryWidget" style="display: none">
                <div class="label">Battery</div>
                <div class="value">
                  <span id="battVal">–</span><small>%</small>
                </div>
                <div class="sub" id="battSub"></div>
              </div>
            </div>
          </section>

          <!-- Page 2: ports -->
          <section class="page">
            <div class="page-title">Listening ports</div>
            <div class="widget" style="flex: 1; min-height: 0">
              <div
                class="list"
                id="portsList"
                style="max-height: none; flex: 1"
              >
                <div class="empty">loading…</div>
              </div>
            </div>
          </section>

          <!-- Page 3: processes -->
          <section class="page">
            <div class="page-title">Top processes</div>
            <div class="widget" style="flex: 1; min-height: 0">
              <div class="list" id="appsList" style="max-height: none; flex: 1">
                <div class="empty">loading…</div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div id="dots"></div>
    </div>

    <script>
      'use strict';

      const $ = (id) => document.getElementById(id);
      const connectBtn = $('connectBtn');
      const connectStatus = $('connectStatus');
      const disconnectBtn = $('disconnectBtn');
      const statusText = $('statusText');
      const dot = $('dot');

      let ws = null;
      let hello = null;
      let pollTimer = null;
      let base = '';
      let wakeLock = null;

      const wakeBadge = $('wakeBadge');
      const wakeSupported = 'wakeLock' in navigator;

      // Fallback for insecure contexts (plain http:// on LAN): iOS keeps the
      // screen awake while a muted, looping video plays.
      const noSleepVideo = document.createElement('video');
      noSleepVideo.src = 'wake.mp4';
      noSleepVideo.loop = true;
      noSleepVideo.muted = true;
      noSleepVideo.playsInline = true;
      noSleepVideo.setAttribute('playsinline', '');
      noSleepVideo.preload = 'auto';
      noSleepVideo.style.cssText =
        'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
      document.body.appendChild(noSleepVideo);

      function setWakeBadge(state) {
        // state: 'on' | 'off' | 'unsupported'
        if (state === 'unsupported') {
          wakeBadge.textContent = 'no wake lock';
          wakeBadge.className = 'off';
        } else if (state === 'on') {
          wakeBadge.textContent = 'awake';
          wakeBadge.className = 'on';
        } else {
          wakeBadge.textContent = 'sleeping';
          wakeBadge.className = 'off';
        }
      }

      // Keep the screen awake while a session is active (re-acquired after
      // the tab was hidden — browsers drop the lock on visibility change).
      async function requestWakeLock() {
        if (wakeSupported) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
              if (ws && ws.readyState === WebSocket.OPEN) setWakeBadge('off');
            });
            setWakeBadge('on');
            return;
          } catch {
            /* fall through to video fallback */
          }
        }
        // Video fallback (also covers browsers without the Wake Lock API).
        try {
          await noSleepVideo.play();
          setWakeBadge('on');
        } catch {
          // iOS requires a user gesture before media can play — retry on
          // the next tap anywhere on the page.
          setWakeBadge('off');
          document.body.addEventListener(
            'pointerdown',
            () => {
              if (
                ws &&
                ws.readyState === WebSocket.OPEN &&
                noSleepVideo.paused
              ) {
                noSleepVideo
                  .play()
                  .then(() => setWakeBadge('on'))
                  .catch(() => {});
              }
            },
            { once: true }
          );
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (
          document.visibilityState === 'visible' &&
          ws &&
          ws.readyState === WebSocket.OPEN
        ) {
          requestWakeLock();
        }
      });
      function releaseWakeLock() {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
        noSleepVideo.pause();
        setWakeBadge('off');
      }

      // ---------- helpers ----------

      function fmtBytes(n) {
        if (n == null || isNaN(n)) return '–';
        const u = ['B', 'KB', 'MB', 'GB', 'TB'];
        let i = 0,
          v = n;
        while (v >= 1024 && i < u.length - 1) {
          v /= 1024;
          i++;
        }
        return `${v.toFixed(i ? 1 : 0)} ${u[i]}`;
      }
      function fmtRate(n) {
        return fmtBytes(n) + '/s';
      }
      function fmtUptime(s) {
        if (s == null) return '–';
        const d = Math.floor(s / 86400),
          h = Math.floor((s % 86400) / 3600),
          m = Math.floor((s % 3600) / 60);
        if (d > 0) return `${d}d ${h}h`;
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m`;
      }
      function setBar(el, pct) {
        el.style.width = Math.min(100, Math.max(0, pct)) + '%';
        el.className = pct > 90 ? 'hot' : pct > 70 ? 'warm' : '';
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
        );
      }

      // ---------- clock (phone-local, always) ----------

      function tickClock() {
        const d = new Date();
        $('clockTime').textContent = d.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });
        $('clockDate').textContent = d.toLocaleDateString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });
      }
      tickClock();
      setInterval(tickClock, 1000);

      // ---------- connect ----------

      function setStatus(text, cls) {
        connectStatus.textContent = text;
        connectStatus.className = cls || '';
      }
      function setDeckStatus(text, ok) {
        statusText.textContent = text;
        dot.style.background = ok ? 'var(--ok)' : 'var(--err)';
        dot.style.boxShadow = ok ? '0 0 8px var(--ok)' : '0 0 8px var(--err)';
      }

      async function pollHttp() {
        try {
          const r = await fetch(`${base}/status`);
          const s = await r.json();
          $('dispVal').textContent = `${s.desktop_width}×${s.desktop_height}`;
          $('dispSub').textContent = `${s.fps} fps · ${s.clients} client(s)`;
        } catch {}
        try {
          const r = await fetch(`${base}/ports`);
          const list = await r.json();
          const el = $('portsList');
          if (!Array.isArray(list) || list.length === 0) {
            el.innerHTML = '<div class="empty">no listeners</div>';
          } else {
            el.innerHTML = list
              .slice(0, 60)
              .map(
                (p) =>
                  `<div class="row"><b>${esc(p.process || '?')}</b><span class="num">${esc(p.protocol)} ${esc(p.address)}:${p.port}</span></div>`
              )
              .join('');
          }
        } catch {}
        try {
          const r = await fetch(`${base}/apps`);
          const list = await r.json();
          const el = $('appsList');
          if (!Array.isArray(list) || list.length === 0) {
            el.innerHTML = '<div class="empty">no data</div>';
          } else {
            const top = [...list]
              .sort((a, b) => b.cpu_percent - a.cpu_percent)
              .slice(0, 8);
            el.innerHTML = top
              .map(
                (a) =>
                  `<div class="row"><b>${esc(a.name)}</b><span class="num">${a.cpu_percent.toFixed(0)}% · ${fmtBytes(a.mem_bytes)}</span></div>`
              )
              .join('');
          }
        } catch {}
      }

      function connect() {
        const host = $('host').value.trim() || '127.0.0.1';
        const port = $('port').value.trim() || '47821';
        const token = $('token').value.trim();
        base = `http://${host}:${port}`;
        const url = `ws://${host}:${port}/ws?token=${encodeURIComponent(token)}`;

        setStatus('Connecting…');
        connectBtn.disabled = true;
        connectBtn.textContent = 'Connecting…';

        ws = new WebSocket(url);
        ws.binaryType = 'blob';

        ws.onopen = () => {
          send({ type: 'hello', name: 'OpenDeck Web', version: 1 });
          document.body.classList.add('in-session');
          setDeckStatus('connected', true);
          requestWakeLock();
          pollHttp();
          pollTimer = setInterval(pollHttp, 5000);
        };

        ws.onmessage = (ev) => {
          if (typeof ev.data !== 'string') return; // frames unused — widget mode
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch {
            return;
          }
          if (msg.type === 'hello') {
            hello = msg;
            $('dispVal').textContent =
              `${msg.desktop_width}×${msg.desktop_height}`;
            $('dispSub').textContent =
              `${msg.stream_width}×${msg.stream_height} stream · ${msg.fps}fps`;
          } else if (msg.type === 'error') {
            setDeckStatus('error: ' + msg.message, false);
          } else if (msg.type === 'stats') {
            const s = msg;
            $('cpuVal').textContent =
              s.cpu_percent != null ? s.cpu_percent.toFixed(0) : '–';
            setBar($('cpuBar'), s.cpu_percent || 0);
            $('memVal').textContent = fmtBytes(s.mem_used);
            $('memTotal').textContent = ' / ' + fmtBytes(s.mem_total);
            $('memSub').textContent = s.swap_total
              ? `swap ${fmtBytes(s.swap_used)} / ${fmtBytes(s.swap_total)}`
              : '';
            setBar(
              $('memBar'),
              s.mem_total ? (s.mem_used / s.mem_total) * 100 : 0
            );
            $('diskVal').textContent = fmtBytes(s.disk_used);
            $('diskTotal').textContent = ' / ' + fmtBytes(s.disk_total);
            setBar(
              $('diskBar'),
              s.disk_total ? (s.disk_used / s.disk_total) * 100 : 0
            );
            $('netRx').textContent = fmtRate(s.net_rx_rate);
            $('netTx').textContent = fmtRate(s.net_tx_rate);
            $('netDown').textContent = fmtRate(s.net_rx_rate);
            $('uptimeVal').textContent = fmtUptime(s.uptime_secs);
            $('uptimeSub').textContent =
              s.net_interfaces && s.net_interfaces.length
                ? s.net_interfaces
                    .map((i) => i.name)
                    .slice(0, 4)
                    .join(' · ')
                : '';
            if (s.battery_percent != null) {
              $('batteryWidget').style.display = '';
              $('battVal').textContent = Math.round(s.battery_percent);
              $('battSub').textContent = s.battery_state || '';
            }
            setDeckStatus(
              `cpu ${s.cpu_percent != null ? s.cpu_percent.toFixed(0) + '%' : '?'} · ${fmtBytes(s.mem_used)}/${fmtBytes(s.mem_total)}`,
              true
            );
          }
        };

        ws.onclose = () => {
          document.body.classList.remove('in-session');
          setDeckStatus('disconnected', false);
          setStatus('Disconnected');
          connectBtn.disabled = false;
          connectBtn.textContent = 'Connect';
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = null;
          releaseWakeLock();
          ws = null;
        };
        ws.onerror = () => {
          setStatus('Connection failed — check host, port and token', 'err');
          setDeckStatus('connection failed', false);
        };
      }

      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify(obj));
      }

      function disconnect() {
        if (ws) ws.close();
      }

      // ---------- Pager ----------

      const track = $('track');
      const dotsEl = $('dots');
      const pages = track.children.length;
      let page = 0;

      for (let i = 0; i < pages; i++) {
        const b = document.createElement('button');
        b.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(b);
      }
      function goTo(i) {
        page = Math.max(0, Math.min(pages - 1, i));
        track.style.transform = `translateX(-${page * 100}%)`;
        [...dotsEl.children].forEach((d, j) =>
          d.classList.toggle('on', j === page)
        );
      }
      goTo(0);

      // Swipe (touch + mouse drag)
      let startX = null;
      $('pager').addEventListener('pointerdown', (e) => {
        startX = e.clientX;
      });
      $('pager').addEventListener('pointerup', (e) => {
        if (startX == null) return;
        const dx = e.clientX - startX;
        startX = null;
        if (Math.abs(dx) > 50) goTo(page + (dx < 0 ? 1 : -1));
      });
      $('pager').addEventListener('pointercancel', () => (startX = null));
      $('prevBtn').addEventListener('click', () => goTo(page - 1));
      $('nextBtn').addEventListener('click', () => goTo(page + 1));
      $('refreshBtn').addEventListener('click', pollHttp);

      connectBtn.addEventListener('click', connect);
      disconnectBtn.addEventListener('click', disconnect);

      // ?host=…&port=…&token=… prefills the form; a token also auto-connects
      // (the server's startup QR encodes exactly this URL).
      const params = new URLSearchParams(location.search);
      for (const k of ['host', 'port', 'token']) {
        const v = params.get(k);
        if (v) $(k).value = v;
      }
      if (params.get('token')) {
        window.addEventListener('load', connect);
      }
    </script>
  </body>
</html>
